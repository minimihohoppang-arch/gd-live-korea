<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD LIVE KOREA — 함께 보는 오늘의 지메</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#f0f3ed;background:#0c100e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0%,#18241a 0,#0c100e 65%);min-height:100vh}.wrap{max-width:1500px;margin:auto;padding:32px 4.5%}button,input,select{font:inherit}button{cursor:pointer}.hero{min-height:330px;border:1px solid #34482d;border-radius:19px;display:flex;overflow:hidden;position:relative;background:radial-gradient(circle at 80% 40%,#253d1a,#101b13 55%,#121b15);box-shadow:0 12px 50px #0005}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#9dcf7730 1px,transparent 1px),linear-gradient(90deg,#9dcf7730 1px,transparent 1px);background-size:44px 44px;transform:skewY(-9deg)}.hero-left{position:relative;z-index:1;padding:36px 4%;width:60%}h1{font-size:clamp(40px,5.2vw,76px);letter-spacing:-.06em;line-height:1.1;margin:0 0 24px;font-weight:850}h1 em{color:#b6ff68;font-style:normal}.subtitle{color:#c7d1c3;font-size:clamp(14px,1.5vw,19px);line-height:1.8}.brands{display:flex;flex-wrap:wrap;gap:21px;margin-top:26px;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-size:16px}.logo{width:29px;height:29px;border-radius:6px;object-fit:cover}.twitch{color:#a66bff;font-weight:900;font-size:28px}.youtube{background:#ff123a;color:white;padding:2px 7px;border-radius:6px}.hero-art{position:absolute;right:8%;top:12%;width:30%;height:76%;display:grid;place-items:center;transform:rotate(-14deg)}.face{width:min(19vw,200px);aspect-ratio:1;border:10px solid #b7ff69;box-shadow:0 0 22px #b7ff6955;position:relative;background:#b7ff69;outline:9px solid #12220d;outline-offset:-18px}.eyes{display:flex;justify-content:space-evenly;margin-top:28%}.eyes i{width:18%;aspect-ratio:1;background:#152512}.mouth{height:15%;width:49%;background:#152512;margin:18% auto 0;transform:skew(8deg)}.eyebrow{font-size:11px;letter-spacing:.2em;color:#a4af9e;margin:34px 0 12px}.headline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.headline h2{font-size:28px;margin:0}.accent{color:#b7ff69}.tools{display:flex;gap:14px;align-items:center}.refresh{border:0;background:#b7ff69;color:#15230e;font-weight:800;padding:14px 23px;border-radius:11px;box-shadow:0 0 17px #a8ff5b4d}.switch{appearance:none;width:44px;height:25px;background:#3e4a38;border-radius:20px;position:relative;vertical-align:middle;cursor:pointer}.switch:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.switch:checked{background:#a3e65c}.switch:checked:after{left:22px}.filters{display:flex;gap:12px;overflow:auto;margin:30px 0 10px;border-bottom:1px solid #283228}.filter{white-space:nowrap;background:none;border:0;color:#aeb6ac;padding:10px 14px 17px;font-weight:650;border-bottom:2px solid transparent}.filter.active{color:#b7ff69;border-color:#b7ff69}.filter img{width:21px;height:21px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:7px}.searchbar{display:flex;gap:10px;margin:12px 0 20px}.searchbar input,.searchbar select{background:#111a13;border:1px solid #334130;color:#e7f0e2;border-radius:10px;padding:16px}.searchbar input{flex:1;min-width:0}.searchbar select{max-width:180px}.notice{padding:16px 18px;border:1px solid #604328;border-radius:11px;background:#2a1d13;color:#e8b991;font-size:14px;margin-bottom:20px}.empty{border:1px solid #293a2b;border-radius:13px;min-height:230px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px;background:radial-gradient(ellipse at center,#17271b,#0d120e 75%)}.signal{font-size:34px;color:#b7ff69;border:1px solid #45612f;border-radius:17px;background:#1d321a;padding:15px;margin-bottom:10px}.empty h3{margin:8px}.empty p{color:#a3b19f;line-height:1.7;margin:4px}.retry{border:0;background:none;color:#b7ff69;margin-top:15px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{border:1px solid #364a32;border-radius:14px;overflow:hidden;background:#18221a}.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:#243a21;font-size:44px}.card-body{padding:16px}.card-body h3{margin:10px 0}.pill{font-size:12px;color:#b7ff69}.watch{display:block;background:#b7ff69;color:#13200d;text-decoration:none;text-align:center;padding:12px;border-radius:9px;font-weight:800;margin-top:15px}.muted{color:#9fac9c;font-size:13px}.bottom{margin-top:24px;color:#788675;font-size:12px}@media(max-width:650px){.wrap{padding:15px}.hero{min-height:310px}.hero-left{width:100%;padding:28px 20px}.hero-art{opacity:.24;right:6%;width:40%;top:24%}.face{width:130px}.brands{gap:12px}.brand{font-size:12px}.headline h2{font-size:22px}.refresh{padding:11px}.searchbar{flex-direction:column}.searchbar select{max-width:none}}
</style></head><body><main class="wrap">
<section class="hero"><div class="hero-left"><h1>함께 보는<br>오늘의 <em>지메.</em></h1><div class="subtitle">한국인 지오메트리 대시 생방송을 한곳에서.<br>새로운 도전의 순간, 함께해요.</div><div class="brands"><span class="brand"><img class="logo" src="assets/chzzk.jpeg">치지직</span><span class="brand"><span class="twitch">▣</span>트위치</span><span class="brand"><img class="logo" src="assets/soop.jpeg">SOOP</span><span class="brand"><span class="youtube">▶</span>유튜브</span></div></div><div class="hero-art"><div class="face"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div></div></section>
<div class="eyebrow">FIND YOUR NEXT STREAM</div><div class="headline"><h2><span class="accent">◉</span> 지금 라이브 <span id="count" class="accent">—</span></h2><div class="tools"><label>자동 갱신 <input class="switch" type="checkbox" id="auto" checked></label><button class="refresh" id="refresh">⟳ 새로고침</button></div></div>
<nav class="filters"><button class="filter active" data-platform="전체">전체</button><button class="filter" data-platform="치지직"><img src="assets/chzzk.jpeg">치지직</button><button class="filter" data-platform="트위치"><span class="twitch">▣</span> 트위치</button><button class="filter" data-platform="SOOP"><img src="assets/soop.jpeg">SOOP</button><button class="filter" data-platform="유튜브"><span class="youtube">▶</span> 유튜브</button></nav>
<div class="searchbar"><input id="query" placeholder="⌕ 방송 제목 또는 닉네임 검색" aria-label="방송 검색"><select id="sort" aria-label="정렬"><option value="viewers">시청자 많은 순</option><option value="name">이름순</option></select></div>
<div class="notice">▥ 치지직 · 트위치 · SOOP · 유튜브 플랫폼의 한국인 지오메트리 대시 생방송을 모아보는 사이트입니다. <strong>현재 실시간 API는 연결되지 않았습니다.</strong></div>
<div id="results"></div><div class="bottom">GD LIVE KOREA · 비공식 팬 프로젝트 · <span id="updated"></span></div>
</main><script>
let platform='전체',streams=[];const el=id=>document.getElementById(id);
function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=el('query').value.trim().toLowerCase();let list=streams.filter(s=>(platform==='전체'||s.platform===platform)&&(s.name+' '+s.title).toLowerCase().includes(q));list.sort((a,b)=>el('sort').value==='name'?a.name.localeCompare(b.name,'ko'):(b.viewers||0)-(a.viewers||0));el('count').textContent=streams.length?list.length:'—';el('results').innerHTML=list.length?'<div class="grid">'+list.map(s=>'<article class="card"><div class="thumb">🎮</div><div class="card-body"><span class="pill">● LIVE · '+safe(s.platform)+'</span><h3>'+safe(s.title)+'</h3><p>'+safe(s.name)+'</p><a class="watch" href="'+safe(s.url)+'" target="_blank" rel="noopener noreferrer">생방송 보러 가기 ↗</a></div></article>').join('')+'</div>':'<div class="empty"><div class="signal">◉</div><h3>잠시 연결을 확인하고 있어요</h3><p>현재 실시간 방송 데이터를 불러올 수 없어요.<br>API 연결 후 방송 목록이 이곳에 표시됩니다.</p><button class="retry" onclick="refresh()">문제가 계속되나요? 다시 시도하기 ⟳</button></div>';el('updated').textContent='마지막 화면 갱신 '+new Date().toLocaleTimeString('ko-KR')}
async function refresh(){try{const res=await fetch('./streams.json?ts='+Date.now(),{cache:'no-store'});if(res.ok){const data=await res.json();streams=Array.isArray(data)?data:[]}}catch(e){}render()}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');platform=b.dataset.platform;render()});el('query').oninput=render;el('sort').onchange=render;el('refresh').onclick=refresh;setInterval(()=>{if(el('auto').checked)refresh()},60000);refresh();
</script></body></html>
